<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js"></script>
</head>

<body class="indexxx">


<h1> Netherlands, migrationland </h1>

<img class="kaart" src="img/ned.png" alt="kaart">

<div class="btn-start">
    <button id="startBtn"> Start with an introduction </button>
    <!-- <button onclick="location.href='kaart.html'"> Snelle start </button> -->
    
</div>

<div>
    <footer>
        <img src="img/zuyd_logo.svg" alt="zuyd" class="logo-footer">
        <img src="img/cbs_logo.svg" alt="cbs" class="logo-footer">
    </footer>
</div>


<div class="fullscreen-video-container" id="videoContainer" style="display: none;">
        <iframe id="vimeoPlayer" class="fullscreen-video" 
            src="https://player.vimeo.com/video/1195178710?controls=0"
                allow="autoplay; fullscreen; picture-in-picture" 
                allowfullscreen 
                frameborder="0">
    </iframe>

    <button id="skipBtn" class="skip-btn">SKIP</button>
</div>

<script src="https://player.vimeo.com/api/player.js"></script>
<script>
    const startBtn = document.getElementById('startBtn');
    const videoContainer = document.getElementById('videoContainer');
    const iframe = document.getElementById('vimeoPlayer');
    const skipBtn = document.getElementById('skipBtn');
    const player = new Vimeo.Player(iframe);

    // Show video in fullscreen when start button is clicked
    startBtn.addEventListener('click', function() {
        videoContainer.style.display = 'block';
        player.setVolume(1); // Ensure sound is on
        player.play();
    });

    // Stop video and navigate when skip button is clicked
    skipBtn.addEventListener('click', function() {
        player.pause();
        player.setVolume(0);
        location.href = 'kaart.html';
    });

    // Navigate to next page when video ends
    player.on('ended', function() {
        location.href = 'kaart.html';
    });
</script>

</body>

</html>
